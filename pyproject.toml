[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mayacardio-heartbeat"
version = "1.0.0"
description = "Resilient dual-sensor heartbeat data collection and processing pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pipeline = "heartbeat_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
